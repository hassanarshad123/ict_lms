# User Management Endpoints

/lms.lms.api.get_user_info:
  get:
    summary: Get current user information
    description: |
      Returns information about the currently logged-in user, including roles and permissions.
      Returns `null` if user is Guest.
    tags:
      - Authentication
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: User information retrieved successfully
        content:
          application/json:
            schema:
              $ref: './schemas/models.yaml#/components/schemas/UserInfo'
            example:
              name: "user@example.com"
              email: "user@example.com"
              full_name: "John Doe"
              user_image: "/files/user.jpg"
              is_admin: false
              is_moderator: false
              is_course_creator: true
              is_teacher: false
              is_student: true
              roles: ["Course Creator", "LMS Student"]
              can_create: true
              can_manage_roles: false

/lms.lms.user.sign_up:
  post:
    summary: Register new user
    description: |
      Create a new user account in the LMS. User will be assigned "LMS Student" role by default.
      Returns status code and message.
    tags:
      - Authentication
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - full_name
              - verify_terms
              - user_category
            properties:
              email:
                type: string
                format: email
                description: User email address
                example: "newuser@example.com"
              full_name:
                type: string
                description: User's full name
                example: "Jane Smith"
              verify_terms:
                type: boolean
                description: Terms and conditions acceptance
                example: true
              user_category:
                type: string
                description: User category/role
                example: "Student"
          example:
            email: "newuser@example.com"
            full_name: "Jane Smith"
            verify_terms: true
            user_category: "Student"
    responses:
      '200':
        description: User registration response
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
              minItems: 2
              maxItems: 2
            example: [1, "Please check your email for verification"]
        examples:
          success:
            value: [1, "Please check your email for verification"]
          already_registered:
            value: [0, "Already Registered"]
          disabled:
            value: [0, "Registered but disabled"]
          admin_verify:
            value: [2, "Please ask your administrator to verify your sign-up"]
      '429':
        description: Too many signups recently
        content:
          text/html:
            schema:
              type: string
              example: "<html>Temporarily Disabled</html>"

/lms.lms.api.get_translations:
  get:
    summary: Get translations
    description: |
      Get all translations for the current user's language.
      Returns translation strings for the frontend.
    tags:
      - Authentication
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: Translations retrieved
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
            example:
              "Course": "Course"
              "Enroll": "Enroll"
              "Lessons": "Lessons"

/lms.lms.api.get_profile_details:
  get:
    summary: Get user profile details
    description: |
      Get detailed profile information for a user by username.
      Includes social links, bio, headline, and other profile fields.
    tags:
      - Users
    security:
      - SessionAuth: []
    parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          example: "johndoe"
    responses:
      '200':
        description: Profile details retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                full_name:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                user_image:
                  type: string
                bio:
                  type: string
                headline:
                  type: string
                language:
                  type: string
                cover_image:
                  type: string
                open_to:
                  type: string
                  enum: [Opportunities, Hiring, None]
                linkedin:
                  type: string
                github:
                  type: string
                twitter:
                  type: string
                roles:
                  type: array
                  items:
                    type: string

/lms.lms.api.get_members:
  get:
    summary: Get members list
    description: |
      Get paginated list of users/members. Only accessible to Moderator, Course Creator, or Batch Evaluator.
      Supports search by name or email.
    tags:
      - Users
    security:
      - SessionAuth: []
    parameters:
      - name: start
        in: query
        schema:
          type: integer
          default: 0
      - name: search
        in: query
        schema:
          type: string
          description: Search by full name or email
    responses:
      '200':
        description: List of members
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  full_name:
                    type: string
                  user_image:
                    type: string
                  username:
                    type: string
                  last_active:
                    type: string
                  role:
                    type: string
                    enum: [Moderator, Course Creator, Batch Evaluator, LMS Student]

/lms.lms.api.get_all_users:
  get:
    summary: Get all users
    description: |
      Get all enabled users. Only accessible to Moderator, Course Creator, or Batch Evaluator.
      Returns dictionary keyed by user email.
    tags:
      - Users
    security:
      - SessionAuth: []
    responses:
      '200':
        description: Dictionary of all users
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  name:
                    type: string
                  full_name:
                    type: string
                  user_image:
                    type: string

/lms.lms.api.get_streak_info:
  get:
    summary: Get learning streak information
    description: |
      Get current and longest learning streak for the logged-in user.
      Streaks are calculated based on activity dates (excluding weekends).
    tags:
      - Users
    security:
      - SessionAuth: []
    responses:
      '200':
        description: Streak information
        content:
          application/json:
            schema:
              type: object
              properties:
                current_streak:
                  type: integer
                  description: Current consecutive days of activity
                longest_streak:
                  type: integer
                  description: Longest streak achieved
            example:
              current_streak: 5
              longest_streak: 12

/lms.lms.api.get_heatmap_data:
  get:
    summary: Get activity heatmap data
    description: |
      Get activity heatmap data for visualization. Shows activity counts per day.
      Includes lesson completions, quiz submissions, and assignment submissions.
    tags:
      - Users
    security:
      - SessionAuth: []
    parameters:
      - name: member
        in: query
        schema:
          type: string
          description: User email (defaults to current user)
      - name: base_days
        in: query
        schema:
          type: integer
          default: 200
          description: Number of days to include
    responses:
      '200':
        description: Heatmap data
        content:
          application/json:
            schema:
              type: object
              properties:
                heatmap_data:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        enum: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            count:
                              type: integer
                            label:
                              type: string
                labels:
                  type: array
                  items:
                    type: string
                total_activities:
                  type: integer
                weeks:
                  type: integer
