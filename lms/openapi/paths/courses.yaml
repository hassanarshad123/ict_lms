# Course Management Endpoints

/lms.lms.utils.get_courses:
  get:
    summary: Get list of courses
    description: |
      Retrieve a paginated list of courses with optional filters.

      Supports filtering by:
      - `title` - Search by course title
      - `enrolled` - Filter by enrollment status
      - `published` - Filter published courses only
      - `certification` - Courses with certification

      **Rate Limit:** 500 requests per hour

    tags:
      - Courses

    security:
      - SessionAuth: []
      - {}

    parameters:
      - name: filters
        in: query
        description: JSON filter object
        required: false
        schema:
          type: string
          example: '{"title": "Python", "published": true}'

      - name: start
        in: query
        description: Pagination offset
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0

    responses:
      '200':
        description: Successful response with course list
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas/models.yaml#/components/schemas/Course'
            example:
              - name: "LMS-COURSE-2024-00001"
                title: "Introduction to Python Programming"
                short_introduction: "Learn Python from scratch"
                image: "/files/python-course.jpg"
                instructors:
                  - name: "instructor@example.com"
                    full_name: "John Doe"
                    user_image: "/files/instructor.jpg"
                price: 99.00
                currency: "USD"
                enrollments: 150
                rating: 4.5
                published: true

      '401':
        $ref: './schemas/responses.yaml#/components/responses/Unauthorized'

      '500':
        $ref: './schemas/responses.yaml#/components/responses/ServerError'

/lms.lms.utils.get_course_details:
  get:
    summary: Get course details
    description: |
      Retrieve comprehensive details about a specific course including:
      - Course metadata
      - Instructor information
      - Enrollment status
      - Current lesson (if enrolled)
      - Pricing information

      **Rate Limit:** 500 requests per hour

    tags:
      - Courses

    security:
      - SessionAuth: []
      - {}

    parameters:
      - name: course
        in: query
        description: Course document ID
        required: true
        schema:
          type: string
          example: "LMS-COURSE-2024-00001"

    responses:
      '200':
        description: Course details retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: './schemas/models.yaml#/components/schemas/Course'
                - type: object
                  properties:
                    is_instructor:
                      type: boolean
                      description: Whether current user is an instructor
                    membership:
                      $ref: './schemas/models.yaml#/components/schemas/Enrollment'
                    current_lesson:
                      type: string
                      description: Current lesson ID if enrolled
            example:
              name: "LMS-COURSE-2024-00001"
              title: "Introduction to Python Programming"
              description: "<p>Comprehensive Python course...</p>"
              short_introduction: "Learn Python from scratch"
              instructors:
                - name: "instructor@example.com"
                  full_name: "John Doe"
              is_instructor: false
              membership:
                progress: 45
                current_lesson: "LMS-LESSON-001"

      '404':
        $ref: './schemas/responses.yaml#/components/responses/NotFound'

/lms.lms.utils.get_course_outline:
  get:
    summary: Get course outline
    description: |
      Retrieve the structured outline of a course including chapters and lessons.
      Optionally includes progress information for enrolled students.

      **Rate Limit:** 500 requests per hour

    tags:
      - Courses

    security:
      - SessionAuth: []
      - {}

    parameters:
      - name: course
        in: query
        description: Course document ID
        required: true
        schema:
          type: string

      - name: progress
        in: query
        description: Include progress information
        required: false
        schema:
          type: boolean
          default: false

    responses:
      '200':
        description: Course outline with chapters and lessons
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Chapter ID
                  title:
                    type: string
                    description: Chapter title
                  lessons:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        title:
                          type: string
                        icon:
                          type: string
                          description: Lesson type icon
                        completed:
                          type: boolean
                          description: Completion status (if progress=true)
            example:
              - name: "CHAPTER-001"
                title: "Getting Started with Python"
                lessons:
                  - name: "LESSON-001"
                    title: "Introduction to Python"
                    icon: "icon-youtube"
                    completed: true
                  - name: "LESSON-002"
                    title: "Variables and Data Types"
                    icon: "icon-text"
                    completed: false

      '404':
        $ref: './schemas/responses.yaml#/components/responses/NotFound'

/lms.lms.utils.get_related_courses:
  get:
    summary: Get related courses
    description: |
      Retrieve courses related to a specific course based on tags and categories.

      **Rate Limit:** 500 requests per hour

    tags:
      - Courses

    security:
      - SessionAuth: []
      - {}

    parameters:
      - name: course
        in: query
        description: Course document ID
        required: true
        schema:
          type: string

    responses:
      '200':
        description: List of related courses
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas/models.yaml#/components/schemas/Course'

/lms.lms.utils.get_tags:
  get:
    summary: Get course tags
    description: |
      Retrieve all tags associated with a course for categorization and filtering.

      **Rate Limit:** 500 requests per hour

    tags:
      - Courses

    security:
      - SessionAuth: []
      - {}

    parameters:
      - name: course
        in: query
        description: Course document ID
        required: true
        schema:
          type: string

    responses:
      '200':
        description: List of course tags
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            example: ["Python", "Programming", "Beginner"]

/lms.lms.utils.get_reviews:
  get:
    summary: Get course reviews
    description: |
      Retrieve all reviews and ratings for a course.

      **Rate Limit:** 500 requests per hour

    tags:
      - Courses

    security:
      - SessionAuth: []
      - {}

    parameters:
      - name: course
        in: query
        description: Course document ID
        required: true
        schema:
          type: string

    responses:
      '200':
        description: List of course reviews
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  rating:
                    type: integer
                    minimum: 1
                    maximum: 5
                  review:
                    type: string
                  owner:
                    type: string
                  owner_details:
                    type: object
                    properties:
                      full_name:
                        type: string
                      user_image:
                        type: string
                  creation:
                    type: string
                    format: date-time
            example:
              - rating: 5
                review: "Excellent course! Very comprehensive."
                owner: "student@example.com"
                owner_details:
                  full_name: "Jane Smith"
                  user_image: "/files/student.jpg"
                creation: "2026-01-10T14:30:00"

/lms.lms.doctype.lms_course_review.lms_course_review.submit_review:
  post:
    summary: Submit course review
    description: |
      Submit a rating and review for a course. User must be enrolled in the course.

    tags:
      - Courses

    security:
      - SessionAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - rating
              - course
            properties:
              rating:
                type: integer
                minimum: 1
                maximum: 5
                description: Rating from 1 to 5 stars
              review:
                type: string
                description: Review text
              course:
                type: string
                description: Course document ID
          example:
            rating: 5
            review: "Great course! Learned a lot."
            course: "LMS-COURSE-2024-00001"

    responses:
      '200':
        description: Review submitted successfully
        content:
          application/json:
            schema:
              type: string
              example: "OK"

      '401':
        $ref: './schemas/responses.yaml#/components/responses/Unauthorized'

      '403':
        $ref: './schemas/responses.yaml#/components/responses/Forbidden'

/lms.lms.api.delete_course:
  delete:
    summary: Delete course
    description: |
      Delete a course and all related data (chapters, lessons, progress records).

      **Permissions:** Course instructor or administrator only.

    tags:
      - Courses

    security:
      - SessionAuth: []

    parameters:
      - name: course
        in: query
        description: Course document ID
        required: true
        schema:
          type: string

    responses:
      '200':
        $ref: './schemas/responses.yaml#/components/responses/Success'

      '401':
        $ref: './schemas/responses.yaml#/components/responses/Unauthorized'

      '403':
        $ref: './schemas/responses.yaml#/components/responses/Forbidden'

      '404':
        $ref: './schemas/responses.yaml#/components/responses/NotFound'
