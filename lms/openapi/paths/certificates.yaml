# Certificate Management Endpoints

/lms.lms.api.get_certified_participants:
  get:
    summary: Get certified participants
    description: |
      Retrieve a list of users who have been certified.
      Supports filtering by category, open_to_opportunities, and hiring status.
    tags:
      - Certificates
    security:
      - SessionAuth: []
      - {}
    parameters:
      - name: filters
        in: query
        description: JSON filter object
        schema:
          type: string
          example: '{"category": "Python", "open_to_opportunities": true}'
      - name: start
        in: query
        schema:
          type: integer
          default: 0
      - name: page_length
        in: query
        schema:
          type: integer
          default: 100
    responses:
      '200':
        description: List of certified participants
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  member:
                    type: string
                  issue_date:
                    type: string
                    format: date
                  batch_name:
                    type: string
                  course:
                    type: string
                  name:
                    type: string
                  full_name:
                    type: string
                  user_image:
                    type: string
                  username:
                    type: string
                  country:
                    type: string
                  headline:
                    type: string
                  open_to:
                    type: string
                  certificate_count:
                    type: integer

/lms.lms.api.get_count_of_certified_members:
  get:
    summary: Get count of certified members
    description: |
      Get the total count of unique certified members.
      Supports filtering by category.
    tags:
      - Certificates
    security:
      - SessionAuth: []
      - {}
    parameters:
      - name: filters
        in: query
        description: JSON filter object
        schema:
          type: string
    responses:
      '200':
        description: Count of certified members
        content:
          application/json:
            schema:
              type: integer
              example: 150

/lms.lms.api.get_certification_categories:
  get:
    summary: Get certification categories
    description: |
      Get all unique course/batch titles that have certifications.
      Used for filtering certified participants.
    tags:
      - Certificates
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: List of categories
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  value:
                    type: string
            example:
              - label: "Python Programming"
                value: "Python Programming"
              - label: "Data Science"
                value: "Data Science"

/lms.lms.api.get_certification_details:
  get:
    summary: Get certification details for course
    description: |
      Get certification information for the current user and a specific course.
      Includes membership status, paid certificate info, and existing certificate.
    tags:
      - Certificates
    security:
      - SessionAuth: []
    parameters:
      - name: course
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Certification details
        content:
          application/json:
            schema:
              type: object
              properties:
                membership:
                  type: object
                  properties:
                    name:
                      type: string
                    purchased_certificate:
                      type: boolean
                paid_certificate:
                  type: boolean
                certificate:
                  type: object
                  nullable: true
                  properties:
                    name:
                      type: string
                    template:
                      type: string

/lms.lms.api.save_certificate_details:
  post:
    summary: Save certificate details
    description: |
      Create or update certificate details for a member.
      Only accessible to authorized evaluators.
    tags:
      - Certificates
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - member
              - course
              - batch_name
              - evaluator
              - issue_date
            properties:
              member:
                type: string
              course:
                type: string
              batch_name:
                type: string
              evaluator:
                type: string
              issue_date:
                type: string
                format: date
              expiry_date:
                type: string
                format: date
              template:
                type: string
              published:
                type: boolean
                default: true
    responses:
      '200':
        description: Certificate saved
        content:
          application/json:
            schema:
              type: string
              description: Certificate document ID

/lms.lms.api.save_evaluation_details:
  post:
    summary: Save evaluation details
    description: |
      Save evaluation details for a certificate request.
      Only accessible to authorized evaluators.
    tags:
      - Certificates
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - member
              - course
              - batch_name
              - evaluator
              - date
              - start_time
              - end_time
              - status
              - rating
              - summary
            properties:
              member:
                type: string
              course:
                type: string
              batch_name:
                type: string
              evaluator:
                type: string
              date:
                type: string
                format: date
              start_time:
                type: string
                format: time
              end_time:
                type: string
                format: time
              status:
                type: string
                enum: [Passed, Failed]
              rating:
                type: integer
                minimum: 0
                maximum: 5
              summary:
                type: string
    responses:
      '200':
        description: Evaluation saved
        content:
          application/json:
            schema:
              type: string
              description: Evaluation document ID

/lms.lms.api.get_admin_evals:
  get:
    summary: Get upcoming evaluations
    description: |
      Get upcoming certificate evaluations.
      Admin sees all, Course Creator sees only their evaluations.
    tags:
      - Certificates
    security:
      - SessionAuth: []
    responses:
      '200':
        description: List of upcoming evaluations
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  date:
                    type: string
                    format: date
                  start_time:
                    type: string
                    format: time
                  course:
                    type: string
                  course_title:
                    type: string
                  evaluator:
                    type: string
                  google_meet_link:
                    type: string
                  member:
                    type: string
                  member_name:
                    type: string

/lms.lms.api.cancel_evaluation:
  post:
    summary: Cancel evaluation
    description: |
      Cancel a scheduled certificate evaluation.
      Only the member who requested it can cancel.
    tags:
      - Certificates
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                description: Certificate Request document ID
    responses:
      '200':
        description: Evaluation cancelled

/lms.lms.api.get_upcoming_evals:
  get:
    summary: Get user's upcoming evaluations
    description: |
      Get upcoming certificate evaluations for the current user.
      Can be filtered by courses or batch.
    tags:
      - Certificates
    security:
      - SessionAuth: []
    parameters:
      - name: courses
        in: query
        description: JSON array of course IDs
        schema:
          type: string
      - name: batch
        in: query
        schema:
          type: string
    responses:
      '200':
        description: List of upcoming evaluations
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  date:
                    type: string
                    format: date
                  start_time:
                    type: string
                    format: time
                  course:
                    type: string
                  course_title:
                    type: string
                  evaluator:
                    type: string
                  evaluator_name:
                    type: string
                  google_meet_link:
                    type: string
                  member:
                    type: string
                  member_name:
                    type: string
