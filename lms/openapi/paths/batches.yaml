# Batch Management Endpoints

/lms.lms.utils.get_batches:
  get:
    summary: Get list of batches
    description: Retrieve all available batches
    tags:
      - Batches
    security:
      - SessionAuth: []
      - {}
    parameters:
      - name: start
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: List of batches
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas/models.yaml#/components/schemas/Batch'

/lms.lms.utils.get_batch_details:
  get:
    summary: Get batch details
    description: Retrieve detailed information about a batch
    tags:
      - Batches
    security:
      - SessionAuth: []
      - {}
    parameters:
      - name: batch
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Batch details
        content:
          application/json:
            schema:
              $ref: './schemas/models.yaml#/components/schemas/Batch'

/lms.lms.doctype.lms_batch.lms_batch.get_batch_timetable:
  get:
    summary: Get batch timetable
    description: Retrieve schedule for a batch
    tags:
      - Batches
    security:
      - SessionAuth: []
    parameters:
      - name: batch
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Batch timetable
        content:
          application/json:
            schema:
              type: array
              items:
                type: object

/lms.lms.utils.enroll_in_batch:
  post:
    summary: Enroll in batch
    description: Enroll user in a batch
    tags:
      - Batches
    security:
      - SessionAuth: []
    parameters:
      - name: batch
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Enrollment successful

/lms.lms.doctype.lms_batch.lms_batch.create_live_class:
  post:
    summary: Create live class
    description: Create a Zoom meeting for a batch (instructor only)
    tags:
      - Batches
    security:
      - SessionAuth: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required:
              - batch_name
              - title
            properties:
              batch_name:
                type: string
              title:
                type: string
              duration:
                type: integer
              date:
                type: string
                format: date
              time:
                type: string
    responses:
      '200':
        description: Live class created
        content:
          application/json:
            schema:
              type: object
              properties:
                start_url:
                  type: string
                join_url:
                  type: string
                meeting_id:
                  type: string

/lms.lms.api.delete_batch:
  delete:
    summary: Delete batch
    description: Delete a batch (instructor only)
    tags:
      - Batches
    security:
      - SessionAuth: []
    parameters:
      - name: batch
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Batch deleted
