          application/json:
            schema:
              type: object
              properties:
                course_title:
                  type: string
                chapter:
                  type: object
                  properties:
                    name:
                      type: string
                    title:
                      type: string
                lesson:
                  type: object
                  nullable: true
                  properties:
                    name:
                      type: string
                    title:
                      type: string
                    body:
                      type: string
                    content:
                      type: string
                    youtube:
                      type: string
                    quiz_id:
                      type: string

/lms.lms.api.update_lesson_index:
  post:
    summary: Update lesson index
    description: |
      Move a lesson within or between chapters.
      Updates the order of lessons.
    tags:
      - Lessons
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - lesson
              - sourceChapter
              - targetChapter
              - idx
            properties:
              lesson:
                type: string
              sourceChapter:
                type: string
              targetChapter:
                type: string
              idx:
                type: integer
    responses:
      '200':
        description: Lesson index updated

/lms.lms.api.update_chapter_index:
  post:
    summary: Update chapter index
    description: Update the order of chapters within a course.
    tags:
      - Courses
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - chapter
              - course
              - idx
            properties:
              chapter:
                type: string
              course:
                type: string
              idx:
                type: integer
    responses:
      '200':
        description: Chapter index updated

/lms.lms.api.delete_chapter:
  delete:
    summary: Delete chapter
    description: |
      Delete a chapter and all its lessons.
      Also deletes SCORM packages if applicable.
    tags:
      - Courses
    security:
      - SessionAuth: []
    parameters:
      - name: chapter
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Chapter deleted

/lms.lms.api.upsert_chapter:
  post:
    summary: Create or update chapter
    description: |
      Create a new chapter or update an existing one.
      Supports SCORM packages.
    tags:
      - Courses
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
              - course
              - is_scorm_package
            properties:
              title:
                type: string
              course:
                type: string
              is_scorm_package:
                type: boolean
              scorm_package:
                type: object
                description: SCORM package file details
              name:
                type: string
                description: Chapter ID (for updates)
    responses:
      '200':
        description: Chapter created/updated
        content:
          application/json:
            schema:
              type: object

/lms.lms.api.delete_documents:
  post:
    summary: Delete documents
    description: |
      Delete multiple documents of a doctype.
      Only accessible to Moderator or Course Creator.
    tags:
      - Utilities
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - doctype
              - documents
            properties:
              doctype:
                type: string
              documents:
                type: array
                items:
                  type: string
    responses:
      '200':
        description: Documents deleted

/lms.lms.api.get_roles:
  get:
    summary: Get user roles
    description: |
      Get LMS roles for a user.
      Only accessible to Moderator.
    tags:
      - Users
    security:
      - SessionAuth: []
    parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          description: User email
    responses:
      '200':
        description: User roles
        content:
          application/json:
            schema:
              type: object
              properties:
                admin:
                  type: boolean
                course_creator:
                  type: boolean
                teacher:
                  type: boolean
                student:
                  type: boolean

/lms.lms.api.save_role:
  post:
    summary: Save user role
    description: |
      Add or remove a role for a user.
      Only accessible to Moderator.
    tags:
      - Users
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - user
              - role
              - value
            properties:
              user:
                type: string
              role:
                type: string
                enum: [Admin, Course Creator, Teacher, Student]
              value:
                type: boolean
                description: true to add, false to remove
    responses:
      '200':
        description: Role saved

/lms.lms.api.add_an_evaluator:
  post:
    summary: Add evaluator
    description: |
      Add a new batch evaluator.
      Creates user if doesn't exist and assigns Batch Evaluator role.
      Only accessible to Moderator.
    tags:
      - Users
    security:
      - SessionAuth: []
    parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
    responses:
      '200':
        description: Evaluator added
        content:
          application/json:
            schema:
              type: object

/lms.lms.api.delete_evaluator:
  delete:
    summary: Delete evaluator
    description: |
      Remove evaluator role and delete Course Evaluator record.
      Only accessible to Moderator.
    tags:
      - Users
    security:
      - SessionAuth: []
    parameters:
      - name: evaluator
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Evaluator deleted

/lms.lms.api.get_evaluator_details:
  get:
    summary: Get evaluator details
    description: |
      Get evaluator details including calendar and time slots.
      Only accessible to Batch Evaluator.
    tags:
      - Users
    security:
      - SessionAuth: []
    parameters:
      - name: evaluator
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Evaluator details
        content:
          application/json:
            schema:
              type: object
              properties:
                slots:
                  type: object
                calendar:
                  type: string
                is_authorised:
                  type: boolean

/lms.lms.api.get_meta_info:
  get:
    summary: Get meta information
    description: Get website meta tags for a route.
    tags:
      - SEO
    security:
      - SessionAuth: []
    parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum: [courses, batches]
      - name: route
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Meta tags
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  key:
                    type: string
                  value:
                    type: string

/lms.lms.api.update_meta_info:
  post:
    summary: Update meta information
    description: |
      Update website meta tags for a route.
      Requires appropriate permissions based on route type.
    tags:
      - SEO
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - meta_type
              - route
              - meta_tags
            properties:
              meta_type:
                type: string
                enum: [courses, batches]
              route:
                type: string
              meta_tags:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    value:
                      type: string
    responses:
      '200':
        description: Meta info updated

/lms.lms.api.create_programming_exercise_submission:
  post:
    summary: Create programming exercise submission
    description: |
      Create or update a programming exercise submission.
      Validates test cases and sets status.
    tags:
      - Programming Exercises
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - exercise
              - submission
              - code
              - test_cases
            properties:
              exercise:
                type: string
              submission:
                type: string
                description: "new" for new submission, or existing submission ID
              code:
                type: string
              test_cases:
                type: array
                items:
                  type: object
                  properties:
                    input:
                      type: string
                    output:
                      type: string
                    expected_output:
                      type: string
                    status:
                      type: string
                      enum: [Passed, Failed]
    responses:
      '200':
        description: Submission created/updated
        content:
          application/json:
            schema:
              type: string
              description: Submission document ID

/lms.lms.api.track_video_watch_duration:
  post:
    summary: Track video watch duration
    description: |
      Track how long a user has watched videos in a lesson.
      Updates existing record if watch time is longer.
    tags:
      - Lessons
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - lesson
              - videos
            properties:
              lesson:
                type: string
              videos:
                type: array
                items:
                  type: object
                  properties:
                    source:
                      type: string
                    watch_time:
                      type: number
                      description: Duration in seconds
    responses:
      '200':
        description: Watch duration tracked

/lms.lms.api.get_recording_status:
  get:
    summary: Get recording status
    description: |
      Get the current upload/processing status of a recording.
      Error messages only visible to admins/creators.
    tags:
      - Recordings
    security:
      - SessionAuth: []
    parameters:
      - name: recording_name
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Recording status
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                title:
                  type: string
                status:
                  type: string
                  enum: [Pending, Processing, Uploaded, Failed]
                error_message:
                  type: string
                  nullable: true
                vimeo_player_embed_url:
                  type: string
                  nullable: true

/lms.lms.api.process_vimeo_recording:
  post:
    summary: Process Vimeo recording (n8n webhook)
    description: |
      Endpoint for n8n-processed Vimeo recordings.
      Matches video to live class and creates recording document.
      Public endpoint (no authentication required for webhook).
    tags:
      - Recordings
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - video_url
              - video_id
            properties:
              video_url:
                type: string
                description: Vimeo player embed URL
              video_id:
                type: string
                description: Vimeo video ID
              created_time:
                type: string
                format: date-time
                description: Video creation time (ISO or Unix timestamp)
              meeting_id:
                type: string
                description: Zoom meeting ID (10-12 digits)
              title:
                type: string
                description: Video title (already cleaned by n8n)
              description:
                type: string
                description: Video description
              duration:
                type: integer
                description: Duration in seconds
    responses:
      '200':
        description: Recording processed
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [success, error]
                message:
                  type: string
                live_class:
                  type: string
                  nullable: true
                recording:
                  type: string
                  nullable: true
                video_url:
                  type: string
                  nullable: true
                lesson_created:
                  type: boolean
                matched_by:
                  type: string
                  nullable: true
                matched:
                  type: boolean
                code:
                  type: string
                  nullable: true

/lms.lms.api.get_openapi_spec:
  get:
    summary: Get OpenAPI specification
    description: |
      Returns the OpenAPI 3.0 specification as JSON.
      Can be used to generate Swagger UI documentation.
    tags:
      - Documentation
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: OpenAPI specification
        content:
          application/json:
            schema:
              type: object
