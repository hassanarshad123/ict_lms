    summary: Get batch announcements
    description: Get communications/announcements for a batch.
    tags:
      - Batches
    security:
      - SessionAuth: []
    parameters:
      - name: batch
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: List of announcements
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  subject:
                    type: string
                  content:
                    type: string
                  recipients:
                    type: string
                  cc:
                    type: string
                  communication_date:
                    type: string
