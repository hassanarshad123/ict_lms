# Miscellaneous Endpoints

/lms.lms.api.get_chart_details:
  get:
    summary: Get dashboard chart details
    description: |
      Get statistics for the LMS dashboard.
      Includes enrollments, courses, users, completions, and certifications.
    tags:
      - Statistics
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: Chart details
        content:
          application/json:
            schema:
              type: object
              properties:
                enrollments:
                  type: integer
                courses:
                  type: integer
                users:
                  type: integer
                completions:
                  type: integer
                certifications:
                  type: integer

/lms.lms.api.get_chart_data:
  get:
    summary: Get chart data
    description: |
      Get time-series chart data for a specific dashboard chart.
      Supports different time grains (Daily, Weekly, Monthly).
    tags:
      - Statistics
    security:
      - SessionAuth: []
      - {}
    parameters:
      - name: chart_name
        in: query
        required: true
        schema:
          type: string
      - name: timegrain
        in: query
        schema:
          type: string
          enum: [Daily, Weekly, Monthly]
          default: Daily
      - name: from_date
        in: query
        schema:
          type: string
          format: date
      - name: to_date
        in: query
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Chart data
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  count:
                    type: number

/lms.lms.api.get_course_completion_data:
  get:
    summary: Get course completion statistics
    description: |
      Get statistics about course completions.
      Returns count of completed vs in-progress enrollments.
    tags:
      - Statistics
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: Completion data
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                    enum: [Completed, In Progress]
                  value:
                    type: integer

/lms.lms.api.get_branding:
  get:
    summary: Get branding details
    description: |
      Get website branding information including logos and images.
      Returns banner image, footer logo, and favicon.
    tags:
      - Settings
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: Branding details
        content:
          application/json:
            schema:
              type: object
              properties:
                banner_image:
                  type: object
                  nullable: true
                  properties:
                    file_name:
                      type: string
                    file_size:
                      type: integer
                    file_url:
                      type: string
                footer_logo:
                  type: object
                  nullable: true
                favicon:
                  type: object
                  nullable: true

/lms.lms.api.get_sidebar_settings:
  get:
    summary: Get sidebar settings
    description: |
      Get sidebar configuration from LMS Settings.
      Includes visibility flags for different sections and custom web pages.
    tags:
      - Settings
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: Sidebar settings
        content:
          application/json:
            schema:
              type: object
              properties:
                courses:
                  type: boolean
                batches:
                  type: boolean
                certifications:
                  type: boolean
                jobs:
                  type: boolean
                statistics:
                  type: boolean
                notifications:
                  type: boolean
                programming_exercises:
                  type: boolean
                web_pages:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      web_page:
                        type: string
                      route:
                        type: string
                      title:
                        type: string
                        description: Label for the sidebar item
                      icon:
                        type: string
                      to:
                        type: string

/lms.lms.api.update_sidebar_item:
  post:
    summary: Update sidebar item
    description: |
      Update icon for a sidebar item.
      Only accessible to authorized users.
    tags:
      - Settings
    security:
      - SessionAuth: []
    parameters:
      - name: webpage
        in: query
        required: true
        schema:
          type: string
      - name: icon
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Sidebar item updated

/lms.lms.api.delete_sidebar_item:
  delete:
    summary: Delete sidebar item
    description: Delete a custom sidebar item.
    tags:
      - Settings
    security:
      - SessionAuth: []
    parameters:
      - name: webpage
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Sidebar item deleted

/lms.lms.api.get_lms_settings:
  get:
    summary: Get LMS settings
    description: |
      Get public LMS settings that can be accessed by guests.
      Includes contact information and feature flags.
    tags:
      - Settings
    security:
      - SessionAuth: []
      - {}
    responses:
      '200':
        description: LMS settings
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_guest_access:
                  type: boolean
                prevent_skipping_videos:
                  type: boolean
                contact_us_email:
                  type: string
                contact_us_url:
                  type: string
                livecode_url:
                  type: string
                disable_pwa:
                  type: boolean

/lms.lms.api.get_unsplash_photos:
  get:
    summary: Get Unsplash photos
    description: |
      Get Unsplash photos for use in course images.
      Can search by keyword or get a default list.
    tags:
      - Media
    security:
      - SessionAuth: []
    parameters:
      - name: keyword
        in: query
        schema:
          type: string
          description: Search keyword
    responses:
      '200':
        description: List of Unsplash photos
        content:
          application/json:
            schema:
              type: array
              items:
                type: object

/lms.lms.api.get_file_info:
  get:
    summary: Get file information
    description: Get file details by file URL.
    tags:
      - Media
    security:
      - SessionAuth: []
    parameters:
      - name: file_url
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: File information
        content:
          application/json:
            schema:
              type: object
              properties:
                file_name:
                  type: string
                file_size:
                  type: integer
                file_url:
                  type: string

/lms.lms.api.get_count:
  get:
    summary: Get document count
    description: |
      Get count of documents matching filters.
      Generic endpoint for counting any doctype.
    tags:
      - Utilities
    security:
      - SessionAuth: []
      - {}
    parameters:
      - name: doctype
        in: query
        required: true
        schema:
          type: string
      - name: filters
        in: query
        required: true
        description: JSON filter object
        schema:
          type: string
    responses:
      '200':
        description: Document count
        content:
          application/json:
            schema:
              type: integer

/lms.lms.api.get_categories:
  get:
    summary: Get categories
    description: |
      Get unique categories from a doctype.
      Used for filtering and dropdowns.
    tags:
      - Utilities
    security:
      - SessionAuth: []
      - {}
    parameters:
      - name: doctype
        in: query
        required: true
        schema:
          type: string
      - name: filters
        in: query
        required: true
        description: JSON filter object
        schema:
          type: string
    responses:
      '200':
        description: List of categories
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  value:
                    type: string

/lms.lms.api.get_my_courses:
  get:
    summary: Get user's courses
    description: |
      Get courses for the current user's dashboard.
      Returns enrolled courses, or featured/popular courses if none enrolled.
    tags:
      - Dashboard
    security:
      - SessionAuth: []
    responses:
      '200':
        description: List of courses
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas/models.yaml#/components/schemas/Course'

/lms.lms.api.get_my_batches:
  get:
    summary: Get user's batches
    description: |
      Get batches for the current user's dashboard.
      Returns enrolled batches, or upcoming batches if none enrolled.
    tags:
      - Dashboard
    security:
      - SessionAuth: []
    responses:
      '200':
        description: List of batches
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas/models.yaml#/components/schemas/Batch'

/lms.lms.api.get_created_courses:
  get:
    summary: Get created courses
    description: |
      Get courses created by the current user (as instructor).
      Admin sees all courses, Course Creator sees only their courses.
    tags:
      - Dashboard
    security:
      - SessionAuth: []
    responses:
      '200':
        description: List of created courses
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas/models.yaml#/components/schemas/Course'

/lms.lms.api.get_created_batches:
  get:
    summary: Get created batches
    description: |
      Get batches created by the current user (as instructor).
      Admin sees all batches, Course Creator sees only their batches.
    tags:
      - Dashboard
    security:
      - SessionAuth: []
    responses:
      '200':
        description: List of created batches
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas/models.yaml#/components/schemas/Batch'

/lms.lms.api.get_my_live_classes:
  get:
    summary: Get user's live classes
    description: |
      Get upcoming live classes for batches the user is enrolled in.
      Returns up to 2 upcoming classes.
    tags:
      - Dashboard
    security:
      - SessionAuth: []
    responses:
      '200':
        description: List of live classes
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  time:
                    type: string
                  date:
                    type: string
                    format: date
                  duration:
                    type: integer
                  attendees:
                    type: integer
                  start_url:
                    type: string
                  join_url:
                    type: string
                  owner:
                    type: string
                  course_title:
                    type: string

/lms.lms.api.get_admin_live_classes:
  get:
    summary: Get admin live classes
    description: |
      Get upcoming live classes for admin/instructor view.
      Admin sees all, Course Creator sees only classes from their batches.
    tags:
      - Dashboard
    security:
      - SessionAuth: []
    responses:
      '200':
        description: List of live classes
        content:
          application/json:
            schema:
              type: array
              items:
                type: object

/lms.lms.api.get_assigned_badges:
  get:
    summary: Get assigned badges
    description: Get badges assigned to a user.
    tags:
      - Badges
    security:
      - SessionAuth: []
    parameters:
      - name: member
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: List of badges
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  badge:
                    type: string
                  name:
                    type: string
                  title:
                    type: string
                  image:
                    type: string

/lms.lms.api.validate_billing_access:
  post:
    summary: Validate billing access
    description: |
      Validate if user can proceed with payment for a course or batch.
      Checks enrollment status, seat availability, etc.
    tags:
      - Payments
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - billing_type
              - name
            properties:
              billing_type:
                type: string
                enum: [course, batch, certificate]
              name:
                type: string
                description: Course or Batch document ID
    responses:
      '200':
        description: Billing access validation
        content:
          application/json:
            schema:
              type: object
              properties:
                access:
                  type: boolean
                message:
                  type: string
                address:
                  type: object
                  nullable: true

/lms.lms.payments.get_payment_link:
  post:
    summary: Get payment link
    description: |
      Generate a payment link for course/batch enrollment or certificate purchase.
      Returns URL to redirect user to payment gateway.
    tags:
      - Payments
    security:
      - SessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - doctype
              - docname
              - title
              - amount
              - currency
              - address
              - redirect_to
            properties:
              doctype:
                type: string
                enum: [LMS Course, LMS Batch]
              docname:
                type: string
              title:
                type: string
              amount:
                type: number
              discount_amount:
                type: number
                default: 0
              gst_amount:
                type: number
                default: 0
              currency:
                type: string
              address:
                type: object
                description: Billing address
              redirect_to:
                type: string
                description: URL to redirect after payment
              payment_for_certificate:
                type: boolean
                default: false
              coupon_code:
                type: string
              coupon:
                type: string
    responses:
      '200':
        description: Payment link generated
        content:
          application/json:
            schema:
              type: string
              description: Payment gateway URL

/lms.lms.utils.get_order_summary:
  get:
    summary: Get order summary
    description: |
      Get order summary with pricing, discounts, and GST.
      Supports coupon codes.
    tags:
      - Payments
    security:
      - SessionAuth: []
    parameters:
      - name: doctype
        in: query
        required: true
        schema:
          type: string
          enum: [LMS Course, LMS Batch]
      - name: docname
        in: query
        required: true
        schema:
          type: string
      - name: coupon
        in: query
        schema:
          type: string
      - name: country
        in: query
        schema:
          type: string
    responses:
      '200':
        description: Order summary
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                name:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                original_amount:
                  type: number
                original_amount_formatted:
                  type: string
                discount_amount:
                  type: number
                discount_amount_formatted:
                  type: string
                gst_applied:
                  type: number
                gst_amount_formatted:
                  type: string
                total_amount:
                  type: number
                total_amount_formatted:
                  type: string
                coupon:
                  type: string

/lms.lms.api.get_payment_gateway_details:
  get:
    summary: Get payment gateway details
    description: |
      Get payment gateway configuration details.
      Only accessible to authorized users.
    tags:
      - Payments
    security:
      - SessionAuth: []
    parameters:
      - name: payment_gateway
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Payment gateway details
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items:
                    type: object
                data:
                  type: object
                doctype:
                  type: string
                docname:
                  type: string

/lms.lms.api.get_new_gateway_fields:
  get:
    summary: Get new gateway fields
    description: Get field definitions for a payment gateway settings doctype.
    tags:
      - Payments
    security:
      - SessionAuth: []
    parameters:
      - name: doctype
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Gateway fields
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  name:
                    type: string
                  type:
                    type: string

/lms.lms.api.get_batch_courses:
  get:
    summary: Get batch courses
    description: Get all courses included in a batch.
    tags:
      - Batches
    security:
      - SessionAuth: []
      - {}
    parameters:
      - name: batch
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: List of courses
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas/models.yaml#/components/schemas/Course'

/lms.lms.api.get_batch_students:
  get:
    summary: Get batch students
