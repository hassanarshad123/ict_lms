                  sender:
                    type: string
                  sender_full_name:
                    type: string
                  image:
                    type: string
                    description: Sender's profile image

/lms.lms.api.get_discussion_topics:
  get:
    summary: Get discussion topics
    description: |
      Get discussion topics for a document (lesson or batch).
      Can return single thread or multiple topics.
    tags:
      - Discussions
    security:
      - SessionAuth: []
    parameters:
      - name: doctype
        in: query
        required: true
        schema:
          type: string
          enum: [Course Lesson, LMS Batch]
      - name: docname
        in: query
        required: true
        schema:
          type: string
      - name: single_thread
        in: query
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Discussion topics
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    name:
                      type: string
                - type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      title:
                        type: string
                      owner:
                        type: string
                      creation:
                        type: string
                        format: date-time
                      modified:
                        type: string
                        format: date-time
                      user:
                        type: object
                        properties:
                          full_name:
                            type: string
                          user_image:
                            type: string

/lms.lms.api.get_discussion_replies:
  get:
    summary: Get discussion replies
    description: Get all replies for a discussion topic.
    tags:
      - Discussions
    security:
      - SessionAuth: []
    parameters:
      - name: topic
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: List of replies
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  owner:
                    type: string
                  creation:
                    type: string
                    format: date-time
                  modified:
                    type: string
                    format: date-time
                  reply:
                    type: string
                  user:
                    type: object
                    properties:
                      full_name:
                        type: string
                      user_image:
                        type: string

/lms.lms.api.get_question_details:
