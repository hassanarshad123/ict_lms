    description: Course management and browsing
  - name: Lessons
    description: Lesson content and progress tracking
  - name: Enrollment
    description: Course enrollment and membership
  - name: Recordings
    description: Live class recordings management
  - name: Batches
    description: Batch management and scheduling
  - name: Quizzes
    description: Quiz submissions and assessments
  - name: Authentication
    description: User authentication and registration

