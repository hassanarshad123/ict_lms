  # Authentication & User
  /lms.lms.api.get_user_info:
    get:
      summary: Get current user information
      description: Returns information about the currently logged-in user, including roles and permissions.
      tags:
        - Authentication
      security:
        - SessionAuth: []
        - {}
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
              example:
                name: "user@example.com"
                email: "user@example.com"
                full_name: "John Doe"
                user_image: "/files/user.jpg"
                is_admin: false
                is_moderator: false
                is_course_creator: true
                is_teacher: false
                is_student: true
                roles: ["Course Creator", "LMS Student"]

  /lms.lms.user.sign_up:
    post:
      summary: Register new user
      description: Create a new user account in the LMS.
      tags:
        - Authentication
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - full_name
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
                full_name:
                  type: string
                  description: User's full name
                verify_terms:
                  type: boolean
                  description: Terms and conditions acceptance
                user_category:
                  type: string
                  description: User category/role
            example:
              email: "newuser@example.com"
              full_name: "Jane Smith"
              verify_terms: true
              user_category: "Student"
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Registration successful"
        '400':
          description: Registration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: sid
      description: |
        Frappe session cookie. Obtained after successful login.
        The cookie is automatically included in requests from the browser.

  schemas:
    $ref: './schemas/models.yaml#/components/schemas'

  responses:
    $ref: './schemas/responses.yaml#/components/responses'

